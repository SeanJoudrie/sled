<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sled — draw a line, he rides it</title>
    <meta name="description" content="Draw a line. He rides it. Deterministic Verlet physics on ruled notebook paper." />
    <!-- Inline, so the page makes no request the smoke test would see as an error. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F6F2E8'/%3E%3Cpath d='M4 22 L28 22 M8 22 L12 14 L20 14' stroke='%231E2430' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      /* It is a sheet of paper. A dark notebook page is not a thing, so this
         commits to one visual world rather than inverting for dark mode. */
      :root {
        color-scheme: light;
        --sled-paper: #f6f2e8;
        --sled-grain: #b9ae94;
        --sled-rule: #c7d2e0;
        --sled-margin-rule: #e0a79e;
        --sled-ink: #1e2430;
        --sled-pencil: #a9a395;
        --sled-red: #c4362e;
        --sled-blue: #2f62b8;
        --sled-yellow: #f2c744;
        --sled-cyan: #7fd4e8;
        --sled-brown: #8a6a3f;
        --sled-green: #6fbf73;
        --sled-pink: #e87fa8;

        --tape: #e8dfc4;
        --strip: #fffdf6;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overscroll-behavior: none; }
      body {
        background: var(--sled-paper);
        color: var(--sled-ink);
        font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }
      #stage.panning { cursor: grabbing; }
      #stage.erasing { cursor: cell; }

      /* The toolbar is a paper strip taped to the page. */
      .rail {
        position: fixed;
        z-index: 2;
        background: var(--strip);
        border: 1px solid rgba(30, 36, 48, 0.14);
        border-radius: 2px;
        box-shadow: 0 1px 0 rgba(30, 36, 48, 0.05), 0 6px 18px rgba(30, 36, 48, 0.07);
        padding: 8px 6px;
      }
      .rail-list { display: flex; gap: 2px; }
      /* Two bits of tape, deliberately not quite square to the strip. */
      .rail::before, .rail::after {
        content: "";
        position: absolute;
        width: 46px;
        height: 17px;
        background: var(--tape);
        opacity: 0.75;
        box-shadow: 0 1px 2px rgba(30, 36, 48, 0.08);
      }

      /* Wide: a vertical strip down the left edge. */
      @media (min-width: 720px) {
        .rail {
          top: 50%;
          left: 14px;
          transform: translateY(-50%);
          width: 132px;
          max-height: calc(100vh - 28px);
        }
        .rail-list {
          flex-direction: column;
          max-height: calc(100vh - 44px);
          overflow-y: auto;
        }
        .rail::before { top: -8px; left: 22px; transform: rotate(-3.5deg); }
        .rail::after { bottom: -8px; right: 20px; transform: rotate(2.5deg); }
      }

      /* Narrow: a horizontal strip along the bottom, scrolled sideways. Every
         entry keeps its name — the palette must never rely on colour alone. */
      @media (max-width: 719px) {
        .rail {
          left: 8px;
          right: 8px;
          bottom: 8px;
        }
        .rail-list {
          flex-direction: row;
          overflow-x: auto;
          align-items: stretch;
        }
        .rail::before { top: -8px; left: 26px; transform: rotate(-3deg); }
        .rail::after { top: -8px; right: 26px; transform: rotate(2deg); }
        .rail .divider { border-top: 0; border-left: 1px dashed rgba(30, 36, 48, 0.2); margin: 2px 4px; }
        .tool { flex: 0 0 auto; }
      }

      .tool {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 4px 8px;
        border: 1.5px solid transparent;
        border-radius: 3px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      .tool:hover { background: rgba(30, 36, 48, 0.05); }
      .tool[aria-pressed="true"] { border-color: var(--sled-ink); background: rgba(30, 36, 48, 0.06); }
      .tool:disabled { opacity: 0.32; cursor: default; }
      .tool:focus-visible { outline: 2px solid var(--sled-ink); outline-offset: 2px; }

      /* The swatch is drawn at the brush's real stroke class: ink is a thin
         opaque line, highlighter a fat translucent band. */
      .swatch { flex: 0 0 auto; width: 22px; height: 20px; position: relative; }
      .swatch::after {
        content: "";
        position: absolute;
        left: 0; right: 0; top: 50%;
        transform: translateY(-50%);
        background: var(--c);
      }
      .swatch.ink::after { height: 2.4px; border-radius: 2px; }
      .swatch.highlighter::after { height: 11px; opacity: 0.55; }
      .swatch.glyph::after { content: none; }
      .swatch svg { position: absolute; inset: 0; width: 100%; height: 100%; }

      .hud {
        position: fixed;
        top: 10px; right: 12px;
        z-index: 2;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 7px 11px;
        background: rgba(246, 242, 232, 0.82);
        border: 1px solid rgba(30, 36, 48, 0.12);
        border-radius: 3px;
        font-variant-numeric: tabular-nums;
      }
      .hud .state { text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; opacity: 0.65; }
      .hud .state[data-state="crashed"], .hud .state[data-state="gone"] { color: var(--sled-red); opacity: 1; }

      .toast {
        position: fixed;
        left: 50%; top: 14px;
        transform: translateX(-50%);
        z-index: 3;
        padding: 8px 14px;
        background: var(--sled-ink);
        color: var(--sled-paper);
        border-radius: 3px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }
      .toast.show { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

      .sr {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div class="hud">
      <span id="tick">tick 0</span>
      <span id="speed">0.00 px/tick</span>
      <span class="state" id="state" data-state="edit">editing</span>
    </div>

    <nav class="rail" id="rail" aria-label="Tools"></nav>

    <div class="toast" id="toast" role="status"></div>
    <p class="sr" id="live" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: deploy

# Publishes the tuning harness to GitHub Pages.
#
# Pages has to be turned on by hand once, under Settings → Pages, with
# "GitHub Actions" as the source. The workflow cannot do it: the default
# token is refused with "Create Pages site failed: Resource not accessible
# by integration", and `enablement: true` on configure-pages hits the same
# wall.
#
# So it checks first, and skips the publish with a notice rather than
# failing, which keeps main green while the setting is still off. The moment
# Pages is enabled, the next push to main publishes with no further changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never publish a build that cannot reproduce its own runs.
      - name: Determinism gate
        run: npm run verify

      - name: Build
        run: npm run build
        env:
          # Pages serves a project site from /<repo>/, so the bundle needs a
          # matching base path or every asset URL 404s.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Is Pages enabled, and sourced from Actions?
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo 000)
          build_type=$(jq -r '.build_type // "none"' < "$body" 2>/dev/null || echo none)

          # Both conditions matter, and the second is the one that bites.
          # A Pages site sourced from a branch answers this endpoint with 200
          # exactly like an Actions-sourced one, so checking only the status
          # code lets the job sail through, upload an artifact nothing will
          # ever consume, and then hang in deploy-pages until it times out —
          # fifteen silent minutes instead of one clear error.
          if [ "$code" = "200" ] && [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ "$code" = "200" ]; then
              echo "::warning title=Pages source is not GitHub Actions::Pages is enabled but its source is \"$build_type\", not \"workflow\". Set Settings → Pages → Source to \"GitHub Actions\"; nothing will publish until then."
            else
              echo "::notice title=Pages not enabled::The build passed but was not published. Enable Pages under Settings → Pages with 'GitHub Actions' as the source. (Pages API returned $code.)"
            fi
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages_check.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_check.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages defaults to a 10 minute timeout, then cancels the
          # deployment it was waiting on. The very first publish of a new Pages
          # site can sit at "deployment_in_progress" for longer than that while
          # GitHub provisions it — which reads as a broken workflow when the
          # workflow is fine and the backend is simply slow. Give it room.
          timeout: 1800000

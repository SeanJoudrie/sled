name: deploy

# Publishes the tuning harness to GitHub Pages.
#
# configure-pages runs with `enablement: true`, so the first run turns Pages on
# and points it at Actions rather than failing with "Get Pages site failed".
# If that step still 404s, Pages is disabled at the org or account level and
# has to be switched on by hand under Settings → Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never publish a build that cannot reproduce its own runs.
      - name: Determinism gate
        run: npm run verify

      - name: Build
        run: npm run build
        env:
          # Pages serves a project site from /<repo>/, so the bundle needs a
          # matching base path or every asset URL 404s.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on first run instead of requiring someone to
          # flip the setting by hand before this workflow can ever pass.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

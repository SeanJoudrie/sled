name: deploy

# Publishes the tuning harness to GitHub Pages.
#
# This needs Pages switched to "GitHub Actions" as its source, under
# Settings → Pages. Until that is done this workflow will fail at the
# configure-pages step — the repository setting cannot be flipped from here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never publish a build that cannot reproduce its own runs.
      - name: Determinism gate
        run: npm run verify

      - name: Build
        run: npm run build
        env:
          # Pages serves a project site from /<repo>/, so the bundle needs a
          # matching base path or every asset URL 404s.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

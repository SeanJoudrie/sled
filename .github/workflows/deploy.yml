name: deploy

# Publishes the tuning harness to GitHub Pages.
#
# Pages has to be turned on by hand once, under Settings → Pages, with
# "GitHub Actions" as the source. The workflow cannot do it: the default
# token is refused with "Create Pages site failed: Resource not accessible
# by integration", and `enablement: true` on configure-pages hits the same
# wall.
#
# So it checks first, and skips the publish with a notice rather than
# failing, which keeps main green while the setting is still off. The moment
# Pages is enabled, the next push to main publishes with no further changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never publish a build that cannot reproduce its own runs.
      - name: Determinism gate
        run: npm run verify

      - name: Build
        run: npm run build
        env:
          # Pages serves a project site from /<repo>/, so the bundle needs a
          # matching base path or every asset URL 404s.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Is Pages enabled?
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo 000)
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::The build passed but was not published. Enable Pages under Settings → Pages with 'GitHub Actions' as the source, and the next push to main will deploy. (Pages API returned $code.)"
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages_check.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_check.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
